name: Bug report
description: Something does not behave as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, or the commit hash if you build from main.
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version and OS
      placeholder: go1.25.0 linux/amd64
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. A minimal program or failing test is best.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: text
