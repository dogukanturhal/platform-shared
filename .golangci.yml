# golangci-lint v2 config for platform-shared (public).
# Applies to whichever module directory golangci-lint is invoked from.
# revive's exported-comment and naming rules are not enforced: the code base
# predates them. gosec stays on and honours inline //nolint:gosec rationales.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - unconvert

  settings:
    gosec:
      severity: medium
      confidence: medium
      excludes: []
    staticcheck:
      # Quick-fix style suggestions (QF*) are not defects.
      checks: ["all", "-QF*", "-ST1023", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  exclusions:
    rules:
      # Deferred Close on readers/writers/bodies: nothing useful to do on error.
      - text: "Error return value of .*Close.* is not checked"
        linters:
          - errcheck
      # Retained helper kept for upstream parity.
      - path: quota/registry\.go
        linters:
          - unused
      # Test fixtures contain intentionally-weak crypto + fake creds
      - path: _test\.go
        linters:
          - gosec
      - path: testdata/
        linters:
          - gosec
